[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "0.1.0"
description = "Durable execution and checkpointing for AI agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# cli: required to use the `agentguard` CLI entry point.
# Install with: pip install agentguard[cli]
cli = ["typer>=0.12.0"]
langgraph = ["langgraph>=0.1.0"]
langchain = ["langchain-core>=0.2.0"]
anthropic = ["anthropic>=0.30.0"]
redis = ["redis>=5.0.0"]
postgres = ["asyncpg>=0.29.0"]
bedrock = ["boto3>=1.34.0"]
all = [
    "agentguard[cli]",
    "agentguard[langgraph]",
    "agentguard[langchain]",
    "agentguard[anthropic]",
    "agentguard[redis]",
    "agentguard[postgres]",
    "agentguard[bedrock]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[redis,postgres]>=4.0.0",
    "agentguard[all]",
]

[project.scripts]
agentguard = "agentguard.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
